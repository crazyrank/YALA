<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Yalamatrix SIS Preview</title>
  <style>
    :root {
      --bg: #F2F4F7;
      --surface: #FFFFFF;
      --text: #1F2933;
      --text-muted: #5B6573;
      --border: #E2E6EC;
      --navy: #1D3557;
      --blue: #1BA8DD;
      --blue-tint: #E4F3FA;
      --navy-tint: #E8EEF7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 104px;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 22px 20px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 4px;
    }
    h1 { font-size: 26px; font-weight: 700; color: var(--navy); }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--navy); color: #FFFFFF;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 16px;
    }
    main { padding: 20px; display: flex; flex-direction: column; gap: 28px; }
    .section-title {
      font-size: 15px; font-weight: 700; color: var(--navy);
      margin-bottom: 12px;
    }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--blue);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(29, 53, 87, 0.05);
    }
    .stat:nth-child(2) { border-left-color: var(--navy); }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--navy); line-height: 1; }
    .stat-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text); margin-top: 8px;
    }
    .stat-hint { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .action {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 12px;
      font: inherit; font-size: 14px; font-weight: 600;
      color: var(--text);
      text-align: center;
      cursor: pointer;
    }
    .action:hover { border-color: var(--blue); }
    .action.primary { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }
    .action.soft { background: var(--blue-tint); border-color: transparent; color: var(--navy); }
    nav.bottom {
      position: fixed;
      left: 16px; right: 16px;
      bottom: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(29, 53, 87, 0.12);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      padding: 8px 6px;
    }
    .nav-item {
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      text-align: center; padding: 8px 0; border-radius: 12px;
    }
    .nav-item.active { color: var(--navy); background: var(--navy-tint); }
    .fab {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--blue); color: #FFFFFF;
      border: 4px solid var(--surface);
      justify-self: center; margin-top: -22px;
      font-size: 22px; cursor: pointer;
      box-shadow: 0 4px 12px rgba(27, 168, 221, 0.35);
    }
    @media (min-width: 720px) {
      main { max-width: 720px; margin: 0 auto; width: 100%; }
      header { padding: 24px max(20px, calc(50% - 360px)); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="eyebrow">Yalamatrix SIS</div>
      <h1>Students</h1>
    </div>
    <div class="avatar">U</div>
  </header>

  <main>
    <section>
      <h2 class="section-title">Overview</h2>
      <div class="stats">
        <article class="stat">
          <div class="stat-value">0</div>
          <div class="stat-label">Students</div>
          <div class="stat-hint">Registered</div>
        </article>
        <article class="stat">
          <div class="stat-value">0</div>
          <div class="stat-label">Enrolled</div>
          <div class="stat-hint">Currently enrolled</div>
        </article>
        <article class="stat">
          <div class="stat-value">0</div>
          <div class="stat-label">Classes</div>
          <div class="stat-hint">Represented</div>
        </article>
        <article class="stat">
          <div class="stat-value">0</div>
          <div class="stat-label">Synced</div>
          <div class="stat-hint">Fully synchronized</div>
        </article>
      </div>
    </section>

    <section>
      <h2 class="section-title">Quick actions</h2>
      <div class="actions">
        <button class="action primary" type="button">Register student</button>
        <button class="action soft" type="button">Export</button>
        <button class="action" type="button">Check results</button>
        <button class="action" type="button">School website</button>
        <button class="action" type="button">Import</button>
        <button class="action" type="button">Promote class</button>
      </div>
    </section>
  </main>

  <nav class="bottom">
    <div class="nav-item active">Students</div>
    <div class="nav-item">Classes</div>
    <button class="fab" type="button" aria-label="Register student">+</button>
    <div class="nav-item">Conflicts</div>
    <div class="nav-item">More</div>
  </nav>
</body>
</html>
